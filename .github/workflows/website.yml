# [INPUT]: 读取公开网站源码、锁文件与可选的专用 Space 写凭据。
# [OUTPUT]: 验证网站；仅手动触发时同步 daftAI2026/gallery。
# [POS]: 网站 CI 与部署边界；不读取 Drive，不写 Dataset。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_to_hf:
        description: 同步到既有的免费 Static Space
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: 安装锁定依赖
        run: npm ci
      - name: 生成内容与路由契约
        run: npm run content:generate && npm run routes:generate
      - name: 类型与 lint
        run: npm exec -- vp check
      - name: 离线测试
        run: npm test
      - name: 静态构建与产物检查
        run: npm run build && npm run build:smoke

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_hf && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 仅导出该提交的网站文件
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lowpoly-space"
          git archive "$GITHUB_SHA:web" | tar -x -C "$RUNNER_TEMP/lowpoly-space"
          cp web/hf-space/README.md "$RUNNER_TEMP/lowpoly-space/README.md"
          test -f "$RUNNER_TEMP/lowpoly-space/package-lock.json"
          if find "$RUNNER_TEMP/lowpoly-space" -type f \( -name '*.glb' -o -name '*.blend' -o -name '*.ipynb' -o -name '*.py' -o -name '*.zip' \) -print -quit | grep -q .; then
            echo '网站同步包含禁止的模型或生产文件。' >&2
            exit 1
          fi
      - name: 安装固定版本的官方 HF CLI
        run: python3 -m pip install --disable-pip-version-check 'huggingface_hub==2.4.0'
      - name: 核对既有静态 Space 并同步
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then
            echo '未配置 HF_SPACE_TOKEN。请由所有者设置仅覆盖目标 Space 的专用写凭据。' >&2
            exit 1
          fi
          python3 - <<'PY'
          from huggingface_hub import HfApi
          info = HfApi().space_info('daftAI2026/gallery')
          if info.sdk != 'static':
              raise SystemExit('目标不是既有 Static Space；拒绝同步。')
          PY
          hf upload daftAI2026/gallery "$RUNNER_TEMP/lowpoly-space" . \
            --repo-type space --revision main \
            --commit-message "Deploy website $GITHUB_SHA"
