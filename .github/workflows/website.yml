# [INPUT]: 读取公开源码、锁文件、已验静态产物与可选专用 Space 写凭据。
# [OUTPUT]: 按路径验证网站并复用 npm 下载缓存；仅手动触发时同步 daftAI2026/lowpoly-world。
# [POS]: 网站 CI 与部署边界；不读取 Drive，不写 Dataset。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_to_hf:
        description: 同步到既有的免费 Static Space
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        working-directory: .
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          base = os.environ.get("BASE_SHA", "")
          code = True
          if os.environ["EVENT_NAME"] != "workflow_dispatch" and base and set(base) != {"0"}:
              result = subprocess.run(["git", "diff", "--name-only", "-z", base, "HEAD"], capture_output=True, check=True)
              paths = [p for p in result.stdout.decode().split("\0") if p]
              code = not paths or any(not p.endswith(".md") or (p.startswith("web/") and not p.endswith("/CLAUDE.md")) for p in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"code={str(code).lower()}\n")
          PYCODE
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装锁定依赖
        if: steps.scope.outputs.code == 'true'
        run: npm ci
      - name: 生成内容与路由契约
        if: steps.scope.outputs.code == 'true'
        run: npm run content:generate && npm run routes:generate
      - name: 类型与 lint
        if: steps.scope.outputs.code == 'true'
        run: npm exec -- vp check
      - name: 离线测试
        if: steps.scope.outputs.code == 'true'
        run: npm test
      - name: 静态构建与产物检查
        if: steps.scope.outputs.code == 'true'
        run: npm run build && npm run build:smoke

      - name: Measure unchanged rebuild
        if: steps.scope.outputs.code == 'true'
        run: time npm run build

      - name: 仅导出已验证的静态产物
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_hf && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lowpoly-space"
          cp -R dist/client/. "$RUNNER_TEMP/lowpoly-space/"
          cp hf-space/README.md "$RUNNER_TEMP/lowpoly-space/README.md"
          cp ../LICENSE "$RUNNER_TEMP/lowpoly-space/LICENSE"
          test -f "$RUNNER_TEMP/lowpoly-space/index.html"
          if find "$RUNNER_TEMP/lowpoly-space" -type f \( -name '*.glb' -o -name '*.blend' -o -name '*.ipynb' -o -name '*.py' -o -name '*.zip' \) -print -quit | grep -q .; then
            echo '网站同步包含禁止的模型或生产文件。' >&2
            exit 1
          fi
      - name: 安装固定版本的官方 HF CLI
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_hf && github.ref == 'refs/heads/main'
        run: python3 -m pip install --disable-pip-version-check 'huggingface_hub==2.4.0'
      - name: 核对既有静态 Space 并同步
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_hf && github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then
            echo '未配置 HF_SPACE_TOKEN。请由所有者设置仅覆盖目标 Space 的专用写凭据。' >&2
            exit 1
          fi
          python3 - <<'PYCODE'
          from huggingface_hub import HfApi
          info = HfApi().space_info('daftAI2026/lowpoly-world')
          if info.sdk != 'static':
              raise SystemExit('目标不是既有 Static Space；拒绝同步。')
          PYCODE
          hf upload daftAI2026/lowpoly-world "$RUNNER_TEMP/lowpoly-space" . \
            --repo-type space --revision main \
            --commit-message "Deploy website $GITHUB_SHA"
